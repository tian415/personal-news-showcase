[project]
name = "personal-news-assistant"
version = "0.1.0"
description = "A private-aware daily news digest"
requires-python = ">=3.12"
dependencies = [
  "email-validator>=2.3.0",
  "feedparser>=6.0.11",
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "trafilatura==2.2.0",
]

[project.scripts]
news-assistant = "news_assistant.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"config/source_registry.yaml" = "news_assistant/resources/source_registry.yaml"

# Source releases must never inherit runtime state from the working checkout.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/config", "/docs", "/experiments", "/scripts", "/examples", "/.github/workflows", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock"]
exclude = ["**/.env", "**/.env.*", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
