name: Collect community signals

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Require private repository for news state
        if: ${{ github.event.repository.private != true }}
        run: |
          echo "Private news state requires a private running repository or a local workspace."
          exit 1
      - uses: actions/checkout@v4
      - name: Initialize or checkout private news state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/news-state"
          cd "$RUNNER_TEMP/news-state"
          if git ls-remote --exit-code --heads origin news-state; then
            git fetch origin news-state
            git checkout -B news-state origin/news-state
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then
              exit "$remote_status"
            fi
            git switch --orphan news-state
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            touch .gitkeep
            git add .gitkeep
            git commit -m "chore: initialize private news state"
            git push --set-upstream origin news-state
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Collect private community signals
        run: >-
          uv run news-assistant collect-signals
          --sources config/source_registry.yaml
          --state-dir "$RUNNER_TEMP/news-state"
      - name: Persist private signal state
        run: |
          cd "$RUNNER_TEMP/news-state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: record community signals"
          git push
